# Configuration de la collecte (lot 1).
# Toutes les sources trouvées dans connectors/ sont actives par défaut :
# ajouter une source ne demande donc que son dossier. Pour en couper une, ajoutez son nom ici.
[connectors]
disabled = []

# Application OAuth Microsoft (guide L1.2) : « Alliance Briefing - demo », client public,
# PKCE, aucun secret. L'identifiant n'est pas un secret ; MS_CLIENT_ID le remplace si définie.
[oauth.microsoft]
client_id = "2cc83c27-af71-4bfc-9338-52885df8f00d"
tenant = "common"  # comptes professionnels et comptes Microsoft personnels
