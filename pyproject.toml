[project]
name = "alliance-briefing"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = []  # ajouter packages/collect, packages/analyse, apps/api quand ils ont un pyproject.toml

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "eval"]
