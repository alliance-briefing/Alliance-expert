[project]
name = "alliance-briefing"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["alliance-api", "pydantic>=2.7"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]  # ajouter packages/collect, packages/analyse quand ils ont un pyproject.toml

[tool.uv.sources]
alliance-api = { workspace = true }

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "httpx", "jsonschema>=4.21", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["contracts", "packages", "apps", "eval"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
