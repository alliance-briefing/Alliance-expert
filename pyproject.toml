[project]
name = "alliance-briefing"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "alliance-api",
    "cryptography>=44",
    "fastembed>=0.9.0",
    "numpy>=2.5.4",
    "pydantic>=2.7",
]

[tool.uv]
package = false
# torch pour processeur (nli) ou pour carte graphique (gpu, réajustement de l'encodeur de M6,
# sur le PC GPU seulement) : les deux groupes ne s'installent pas ensemble.
conflicts = [[{ group = "nli" }, { group = "gpu" }]]

[tool.uv.workspace]
members = ["apps/api"]  # ajouter packages/collect, packages/analyse quand ils ont un pyproject.toml

[tool.uv.sources]
alliance-api = { workspace = true }
torch = [
    { index = "pytorch-cpu", group = "nli" },
    { index = "pytorch-cuda", group = "gpu" },
]

# torch « CPU seulement » : évite les bibliothèques GPU NVIDIA (plusieurs Go) sous Linux.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# torch CUDA 13.0 (cartes RTX 40xx, pilote NVIDIA récent) pour le groupe gpu.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "httpx",
    "jsonschema>=4.21",
    "pre-commit",
    "numpy>=2.5.4",
]
embeddings = [
    "fastembed>=0.9.0",
]
nli = [
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]
gpu = [
    "onnx>=1.17",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["contracts", "packages", "apps", "eval"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
