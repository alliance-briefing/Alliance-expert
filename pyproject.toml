[project]
name = "alliance-briefing"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["alliance-api"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]  # ajouter packages/collect, packages/analyse quand ils ont un pyproject.toml

[tool.uv.sources]
alliance-api = { workspace = true }

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov", "httpx", "pre-commit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "eval"]
addopts = "--import-mode=importlib"
