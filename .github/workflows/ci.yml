name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      # 1. ruff
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 2. pytest + couverture, puis seuils (à partir de la v0.2.0) : 80 % sur packages/
      #    (§ CI du guide) et 80 % sur packages/collect (L1.9)
      - run: uv run pytest --cov=packages --cov=apps --cov-report=term-missing
      - run: uv run coverage report --include="packages/*" --fail-under=80 --format=total
      #    lot 1 mesuré sur son seul code : hors tests et hors synth/ et trainset/ (lot 2)
      - run: uv run coverage report --include="packages/collect/*" --omit="*/tests/*,*/test_*.py,packages/collect/synth/*,packages/collect/trainset/*" --fail-under=80 --format=total
      # 3. fixtures de démo validées contre le JSON Schema du contrat A (les fixtures B sont testées par pytest)
      - run: uv run python -m contracts.validate_fixtures

  # 6. Évaluation du brief (L3.6) : métriques de la base contre celles de la PR, calculées avec
  #    le même évaluateur et les mêmes annotations (eval/ de la PR copié dans la base) ; alerte
  #    ::warning:: si une métrique perd plus de 3 points. Non bloquant pour l'instant : le guide
  #    demande de bloquer à partir de v0.9.0, sur décision du référent. Pour bloquer :
  #    EVAL_BLOQUANT: "true" et retirer continue-on-error.
  eval-regression:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      EVAL_BLOQUANT: "false"
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed  # modèle du score appris
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('packages/analyse/rag/embeddings.py') }}
          restore-keys: fastembed-
      - name: base de comparaison
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            BASE="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null || [ "$BASE" = "$(git rev-parse HEAD)" ]; then
            echo "::notice title=Évaluation::pas de base de comparaison ($BASE)"
            BASE=""
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - name: métriques de la PR
        run: uv run python -m eval --json "$RUNNER_TEMP/pr.json"
      - name: métriques de la base
        id: base_metrics
        if: steps.base.outputs.sha != ''
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          rm -rf "$RUNNER_TEMP/base/eval"
          cp -r eval "$RUNNER_TEMP/base/eval"
          cd "$RUNNER_TEMP/base"
          if uv sync --all-packages --frozen && uv run python -m eval --json "$RUNNER_TEMP/base.json"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Évaluation non comparable::la base ne s'évalue pas avec l'évaluateur de la PR"
          fi
      - name: comparaison
        if: steps.base_metrics.outputs.ok == 'true'
        run: |
          STRICT=""
          if [ "$EVAL_BLOQUANT" = "true" ]; then STRICT="--strict"; fi
          uv run python -m eval.compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/pr.json" --github $STRICT

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binaire gitleaks (gratuit) : l'action officielle exige une licence pour les organisations
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. build de l'API + docker compose + test de santé
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: curl -fsS http://localhost:8000/health
      # appel réel : contracts et packages.analyse s'importent dans le conteneur
      - name: brief de démonstration
        env:
          AUTH: "X-Demo-User: u_demo_001"
        run: |
          curl -fsS -X POST http://localhost:8000/briefs -H "$AUTH" -H "Content-Type: application/json" -d '{"date": "2026-10-07"}'
          curl -fsS http://localhost:8000/briefs/2026-10-07 -H "$AUTH" -o brief.json
          python3 -c "import json; assert json.load(open('brief.json'))['brief_id'] == 'b_2026-10-07_u_demo_001'"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
