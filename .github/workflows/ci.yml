name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      # 1. ruff
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 2. pytest + couverture (à partir de la v0.2.0 : ajouter --cov-fail-under=80 sur packages/)
      - run: uv run pytest --cov=packages --cov=apps --cov-report=term-missing
      # 3. fixtures de démo validées contre le JSON Schema du contrat A (les fixtures B sont testées par pytest)
      - run: uv run python -m contracts.validate_fixtures

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binaire gitleaks (gratuit) : l'action officielle exige une licence pour les organisations
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. build de l'API + docker compose + test de santé
      - run: cp infra/.env.example infra/.env
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: curl -fsS http://localhost:8000/health
      # appel réel : contracts et packages.analyse s'importent dans le conteneur
      - name: brief de démonstration
        env:
          AUTH: "X-Demo-User: u_demo_001"
        run: |
          curl -fsS -X POST http://localhost:8000/briefs -H "$AUTH" -H "Content-Type: application/json" -d '{"date": "2026-10-07"}'
          curl -fsS http://localhost:8000/briefs/2026-10-07 -H "$AUTH" -o brief.json
          python3 -c "import json; assert json.load(open('brief.json'))['brief_id'] == 'b_2026-10-07_u_demo_001'"
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
