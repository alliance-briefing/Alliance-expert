name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --dev
      # 1. ruff
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 2. pytest + couverture (seuil 80 % sur packages/ à partir de la v0.2.0)
      - run: uv run pytest --cov=packages --cov-report=term-missing
      # 3. validation des fixtures contre les JSON Schema
      # TODO: script de validation contracts/fixtures -> contracts/schemas

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. build de l'API + docker compose + test de santé
      # TODO: activer quand infra/docker-compose.yml et le Dockerfile de l'API existent
      - run: echo "docker compose -f infra/docker-compose.yml up -d --build && curl -f http://localhost:8000/health"
