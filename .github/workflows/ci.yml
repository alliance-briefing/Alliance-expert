name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      # 1. ruff
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # 2. pytest + couverture, puis seuils (à partir de la v0.2.0) : 80 % sur packages/
      #    (§ CI du guide) et 80 % sur packages/collect (L1.9)
      - run: uv run pytest --cov=packages --cov=apps --cov-report=term-missing
      - run: uv run coverage report --include="packages/*" --fail-under=80 --format=total
      #    lot 1 mesuré sur son seul code : hors tests et hors synth/ et trainset/ (lot 2)
      - run: uv run coverage report --include="packages/collect/*" --omit="*/tests/*,*/test_*.py,packages/collect/synth/*,packages/collect/trainset/*" --fail-under=80 --format=total
      # 3. fixtures de démo validées contre le JSON Schema du contrat A (les fixtures B sont testées par pytest)
      - run: uv run python -m contracts.validate_fixtures

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Binaire gitleaks (gratuit) : l'action officielle exige une licence pour les organisations
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 5. build de l'API + docker compose + test de santé, sans infra/.env (L3.8)
      # canari : un jeu caché présent dans la copie locale ne doit jamais entrer dans l'image
      - run: mkdir -p eval/hidden && echo canari > eval/hidden/canari.txt
      - run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - run: docker compose -f infra/docker-compose.yml exec -T api test ! -e /app/eval/hidden
      - run: curl -fsS http://localhost:8000/health
      # appel réel : contracts et packages.analyse s'importent dans le conteneur
      - name: brief de démonstration
        env:
          AUTH: "X-Demo-User: u_demo_001"
        run: |
          curl -fsS -X POST http://localhost:8000/briefs -H "$AUTH" -H "Content-Type: application/json" -d '{"date": "2026-10-07"}'
          curl -fsS http://localhost:8000/briefs/2026-10-07 -H "$AUTH" -o brief.json
          python3 -c "import json; assert json.load(open('brief.json'))['brief_id'] == 'b_2026-10-07_u_demo_001'"
          # hors ligne (HF_HUB_OFFLINE=1) : le score appris se charge depuis l'image, sans repli
          ! grep -q "score appris indisponible" brief.json
      # briefs dans le volume (BRIEFS_DIR) : relus après un redémarrage, sans regénération
      - name: brief conservé au redémarrage
        run: |
          docker compose -f infra/docker-compose.yml restart api
          docker compose -f infra/docker-compose.yml up -d --wait
          curl -fsS http://localhost:8000/briefs/2026-10-07 -H "X-Demo-User: u_demo_001" -o relu.json
          cmp brief.json relu.json
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
