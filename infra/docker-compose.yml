services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: briefing
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: briefing
